on:
  # Temporary: exercise the real release graph without publishing.
  pull_request:
  push:
    tags:
      - v*
permissions:
  contents: write
name: make-release
jobs:
  prepare:
    name: Prepare release builds
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      prerelease: ${{ steps.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Prepare sources and tools
        id: prepare
        uses: ./.github/actions/prepare-cross
  makerelease:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-pc-windows-gnu
            # Start fresh when switching from host MinGW to the container toolchain.
            cache-version: v2
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
    name: make release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust
        id: rust
        uses: dtolnay/rust-toolchain@stable
      - if: ${{ matrix.os == 'macos-latest' }}
        name: Install deps
        shell: bash
        run: |
          brew install coreutils
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Restore shared cargo sources
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
          key: cross-sources-v1-${{ hashFiles('Cargo.lock') }}
      - name: Download Linux cross tool
        if: matrix.os == 'ubuntu-latest'
        uses: actions/download-artifact@v8
        with:
          name: cross-tool-Linux-X64
          path: ${{ runner.temp }}/cross-tools
      - name: Enable Linux cross tool
        if: matrix.os == 'ubuntu-latest'
        run: |
          chmod +x "$RUNNER_TEMP/cross-tools/cross"
          echo "$RUNNER_TEMP/cross-tools" >> "$GITHUB_PATH"
      # Share matching PR build caches. Include the host as well as the target:
      # target/ also contains host-built
      # proc macros and build scripts. Never fall back to another host/target.
      - name: Cache cargo build
        uses: actions/cache@v6.1.0
        with:
          path: target/release-builds/${{ matrix.target }}
          key: cross-build-${{ matrix.cache-version || 'v1' }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cross-build-${{ matrix.cache-version || 'v1' }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}-
      - name: Run make release
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          make release CROSS_TARGETS="$RELEASE_TARGET" VERSION="$RELEASE_VERSION"
          ls -la cross
        shell: bash
      - name: Name target installation instructions
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: mv cross/README.md "cross/$RELEASE_TARGET-README.md"
      - name: Upload target release files
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: cross
          if-no-files-found: error
  createrelease:
    runs-on: ubuntu-latest
    needs: [prepare, makerelease]
    name: createrelease
    env:
      VERSION: v${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Download all target release files
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: build
          merge-multiple: true
      - name: Combine installation instructions and check artifacts
        shell: bash
        run: |
          echo 'These instructions are meant as an easy way to install. Unix snippets use `sha256sum`; macOS users may need `coreutils` for that command.' > release.md
          echo "" >> release.md
          targets=(
            x86_64-apple-darwin
            aarch64-apple-darwin
            x86_64-pc-windows-gnu
            x86_64-unknown-linux-musl
            aarch64-unknown-linux-musl
          )
          for target in "${targets[@]}"; do
            test -s "build/zoo-$target"
            for algorithm in md5 sha256; do
              hash=$(awk '{print $1}' "build/zoo-$target.$algorithm")
              echo "$hash  build/zoo-$target" | "${algorithm}sum" -c -
            done
            cat "build/$target-README.md" >> release.md
            rm "build/$target-README.md"
          done
          # Keep the download site's combined README and GitHub release body identical.
          cp release.md build/README.md
          mkdir -p "releases/cli/$VERSION"
          cp build/* "releases/cli/$VERSION/"
      - name: Authenticate to Google Cloud
        if: github.event_name == 'push'
        uses: google-github-actions/auth@v3.0.0
        with:
          credentials_json: '${{ secrets.GOOGLE_CLOUD_DL_SA }}'
      - name: Set up Cloud SDK
        if: github.event_name == 'push'
        uses: google-github-actions/setup-gcloud@v3.0.1
        with:
          project_id: kittycadapi
      - name: Upload binary files
        if: github.event_name == 'push'
        uses: google-github-actions/upload-cloud-storage@v3.0.0
        with:
          path: releases
          destination: dl.kittycad.io
      - name: Create a Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3.0.3
        with:
          body_path: ${{ github.workspace }}/release.md
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          files: ./build/zoo-*
  createhomebrew:
    runs-on: ubuntu-latest
    needs: [prepare, createrelease]
    name: createhomebrew
    env:
      VERSION: v${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@master
      - name: bundle binaries and make formula
        shell: bash
        run: |
          mkdir homebrew
          cp homebrew-template.rb homebrew/kittycad.rb

          input_names=(
            "x86_64-apple-darwin"
            "aarch64-apple-darwin"
            "x86_64-unknown-linux-musl"
            "aarch64-unknown-linux-musl"
          )
          homebrew_names=(
            "x86_64_darwin"
            "aarch64_darwin"
            "x86_64_linux"
            "aarch64_linux"
          )

          to_zip_files=""
          version="$VERSION"
          sed -i "s#replace-semver#$version#g" "./homebrew/kittycad.rb"

          for i in "${!input_names[@]}"; do
            input_name="${input_names[$i]}"
            homebrew_name="${homebrew_names[$i]}"

            mkdir "./homebrew/$homebrew_name"
            curl -L "https://dl.zoo.dev/releases/cli/$version/zoo-$input_name" -o "./homebrew/$homebrew_name/zoo"

            sha256=$(sha256sum "./homebrew/$homebrew_name/zoo")
            hash=$(printf '%s\n' "$sha256" | cut -d' ' -f1)
            sed -i "s#replace-$homebrew_name-sha#$hash#g" "./homebrew/kittycad.rb"

            to_zip_files="$to_zip_files $homebrew_name/zoo"
          done

          (cd ./homebrew && tar -czvf kittycad-cli.tar.gz $to_zip_files)

          sha256=$(sha256sum "./homebrew/kittycad-cli.tar.gz")
          hash=$(printf '%s\n' "$sha256" | cut -d' ' -f1)
          sed -i "s#replace-tarball-sha#$hash#g" "./homebrew/kittycad.rb"

          # clean up
          for homebrew_name in "${homebrew_names[@]}"; do
            rm -rf "./homebrew/$homebrew_name"
          done

          # verify output, debug code remove later.
          echo "tarball and formula"
          (cd ./homebrew && ls)
          echo "formula contents"
          cat ./homebrew/kittycad.rb
      - name: move files to dir for upload
        shell: bash
        run: |
          mkdir -p releases/$(basename $(pwd))
          cp -r homebrew releases/$(basename $(pwd))/${VERSION}
      - name: Verify Homebrew bundle
        run: |
          ! grep -q 'replace-' homebrew/kittycad.rb
          tar -tzf homebrew/kittycad-cli.tar.gz
