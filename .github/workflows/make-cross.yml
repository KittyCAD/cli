on:
  push:
    branches:
      - main
    paths:
      - '**.rs'
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/make-cross.yml
      - .github/actions/prepare-cross/action.yml
      - .github/workflows/cross-deps.sh
      - Makefile
      - scripts/release-install-instructions.sh
      - 'rust-toolchain.toml'
      - 'spec.json'
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
name: make cross
jobs:
  prepare:
    name: Prepare cross builds
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Prepare sources and tools
        id: prepare
        uses: ./.github/actions/prepare-cross
  cross:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-pc-windows-gnu
            # Start fresh when switching from host MinGW to the container toolchain.
            cache-version: v2
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
    name: make cross (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Rust
        id: rust
        uses: dtolnay/rust-toolchain@stable
      - if: ${{ matrix.os == 'macos-latest' }}
        name: Install deps
        shell: bash
        run: |
          brew install coreutils
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Restore shared cargo sources
        uses: actions/cache/restore@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
          key: cross-sources-v1-${{ hashFiles('Cargo.lock') }}
      - name: Download Linux cross tool
        if: matrix.os == 'ubuntu-latest'
        uses: actions/download-artifact@v8
        with:
          name: cross-tool-Linux-X64
          path: ${{ runner.temp }}/cross-tools
      - name: Enable Linux cross tool
        if: matrix.os == 'ubuntu-latest'
        run: |
          chmod +x "$RUNNER_TEMP/cross-tools/cross"
          echo "$RUNNER_TEMP/cross-tools" >> "$GITHUB_PATH"
      # Include the host as well as the target: target/ also contains host-built
      # proc macros and build scripts. Never fall back to another host/target.
      - name: Cache cargo build
        uses: actions/cache@v6.1.0
        with:
          path: target/release-builds/${{ matrix.target }}
          key: cross-build-${{ matrix.cache-version || 'v1' }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            cross-build-${{ matrix.cache-version || 'v1' }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}-
      - name: Run make cross
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          make release CROSS_TARGETS="$RELEASE_TARGET" VERSION="$RELEASE_VERSION"
          ls -la cross
        shell: bash
